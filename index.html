<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIDDHI Collections | Kurti Catalogue</title>
  <style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  background: #f7f5f2;
  color: #222;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 14px;
}

.header {
  text-align: center;
  padding: 8px 0 10px;
}

.brand-logo {
  width: 230px;
  max-width: 72%;
  height: auto;
  display: block;
  margin: 0 auto 8px;
}

.subtitle {
  color: #777;
  font-size: 18px;
  line-height: 1.25;
  text-align: left;
  margin: 0 0 10px;
}

.search {
  width: 100%;
  height: 44px;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: #fff;
  font-size: 15px;
  outline: none;
}

.search:focus {
  border-color: #bbb;
}

.filters {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 10px 0 12px;
  padding: 0 0 3px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {
  flex: 0 0 auto;
  border: 1px solid #ddd;
  background: #fff;
  color: #087bd6;
  border-radius: 9px;
  padding: 8px 12px;
  min-height: 40px;
  font-size: 15px;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
}

.filter.active {
  background: #222;
  color: #fff;
  border-color: #222;
}

#count {
  font-size: 21px !important;
  line-height: 1.2 !important;
  color: #888 !important;
  margin: 6px 0 9px !important;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
}

.product {
  min-width: 0;
  width: 100%;
  background: #fff;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.product-image {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1.20;
  object-fit: cover;
  background: #eee;
}

.product-info {
  min-width: 0;
  padding: 7px;
}

.code {
  font-size: 14px;
  line-height: 1.15;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.name {
  font-size: 17px;
  line-height: 1.15;
  font-weight: 700;
  margin-top: 3px;
}

.colour {
  font-size: 14px;
  line-height: 1.15;
  color: #777;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sizes {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
  margin-top: 7px;
}

.size {
  min-width: 0;
  min-height: 36px;
  padding: 6px 2px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 12px;
  line-height: 1.05;
  font-weight: 700;
  white-space: nowrap;
  cursor: default;
}

.available {
  background: #e5f6ed;
  color: #08733d;
  cursor: pointer;
}

.size.available.selected {
  outline: 3px solid #198754;
  outline-offset: -3px;
}

.sold {
  background: #fae8e8;
  color: #b42f2f;
}

.size-warning {
  color: #c62828;
  font-size: 12px;
  line-height: 1.25;
  font-weight: 700;
  text-align: center;
  margin: 5px 0;
}

.whatsapp {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 6px;
  padding: 10px 4px;
  border-radius: 7px;
  background: #16834b;
  color: #fff;
  text-decoration: none;
  text-align: center;
  font-size: 18px;
  line-height: 1.1;
  font-weight: 700;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 10px;
  color: #777;
}

@media (max-width: 600px) {

  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 100%;
    padding: 12px 14px 18px;
  }

  .header {
    padding: 5px 0 8px;
  }

  .brand-logo {
    width: 215px;
    max-width: 62%;
    margin: 0 auto 9px;
  }

  .subtitle {
    font-size: 18px;
    line-height: 1.25;
    margin: 0 0 10px;
  }

  .search {
    height: 44px;
    padding: 8px 11px;
    font-size: 15px;
    border-radius: 12px;
  }

  .filters {
    gap: 6px;
    margin: 10px 0 12px;
  }

  .filter {
    padding: 8px 11px;
    min-height: 40px;
    font-size: 15px;
    border-radius: 9px;
  }

  #count {
    font-size: 21px !important;
    margin: 6px 0 9px !important;
  }

  .products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .product {
    border-radius: 9px;
  }

  .product-info {
    padding: 7px;
  }

  .code {
    font-size: 14px;
  }

  .name {
    font-size: 17px;
  }

  .colour {
    font-size: 14px;
  }

  .sizes {
    gap: 4px;
    margin-top: 7px;
  }

  .size {
    min-height: 36px;
    padding: 6px 2px;
    font-size: 12px;
    border-radius: 6px;
  }

  .whatsapp {
    min-height: 44px;
    margin-top: 6px;
    padding: 10px 4px;
    font-size: 18px;
    border-radius: 7px;
  }
}

@media (max-width: 360px) {

  .container {
    padding-left: 10px;
    padding-right: 10px;
  }

  .brand-logo {
    width: 200px;
    max-width: 65%;
  }

  .subtitle {
    font-size: 16px;
  }

  .search {
    font-size: 14px;
  }

  .filter {
    font-size: 14px;
    padding-left: 10px;
    padding-right: 10px;
  }

  #count {
    font-size: 19px !important;
  }

  .product-info {
    padding: 6px;
  }

  .code {
    font-size: 13px;
  }

  .name {
    font-size: 15px;
  }

  .colour {
    font-size: 13px;
  }

  .size {
    min-height: 34px;
    font-size: 11px;
  }

  .whatsapp {
    min-height: 42px;
    font-size: 16px;
  }
}

  </style>
</head>
<body>

<div class="container">

<div class="header">

<img
  id="brandLogo"
  class="brand-logo"
  alt="RIDDHI"
>

</div>


<div class="subtitle">
    Browse designs & check availability
</div>





  <input
    id="search"
    class="search"
    placeholder="🔎 Search design, code or colour"
    oninput="displayProducts()"
  >

  <div id="filters" class="filters"></div>

  <div id="count"
       style="font-size:32px;color:#888;margin:7px 0">
  </div>

  <div id="products"
       class="products">
  </div>
</div>

<script>
const SIZE_LIST = [
  "S",
  "M",
  "L",
  "XL",
  "2XL",
  "3XL",
  "4XL",
  "5XL"
];

let products = [];
let selectedSize = "";
let adminPin = "";
let editingId = "";
let uploadedPhotoUrl = "";


/* LOAD PRODUCTS FROM APPS SCRIPT API */

const API_URL = "https://script.google.com/macros/s/AKfycbxkEggaj9_CzimoqhdA12Wt_HW72J_BrHTeSGle87kzUUBDhFXtgdsWycHCL2kCc1u_fg/exec";

function loadProducts() {

  const callbackName = "riddhiProducts_" + Date.now();

  window[callbackName] = function(data) {

    products = data || [];

    createFilters();
    displayProducts();

    delete window[callbackName];

    const script = document.getElementById(callbackName);
    if (script) script.remove();

  };

  const script = document.createElement("script");

  script.id = callbackName;
  script.src =
    API_URL +
    "?action=products&callback=" +
    encodeURIComponent(callbackName);

  script.onerror = function() {

    delete window[callbackName];

    document.getElementById("products").innerHTML =
      '<div class="empty">Unable to load catalogue. Please refresh.</div>';

  };

  document.head.appendChild(script);

}


/* FILTERS */

function createFilters() {

  const filters =
    document.getElementById("filters");

  filters.innerHTML =
    '<button class="filter active" onclick="filterSize(\'\',this)">All</button>';

  SIZE_LIST.forEach(function(size) {

    filters.innerHTML +=
      '<button class="filter" onclick="filterSize(\'' +
      size +
      '\',this)">' +
      size +
      '</button>';

  });

}


function filterSize(size, button) {

  selectedSize = size;

  document
    .querySelectorAll(".filter")
    .forEach(function(btn) {

      btn.classList.remove("active");

    });

  button.classList.add("active");

  displayProducts();

}


/* DISPLAY PRODUCTS */

function displayProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const list =
    products.filter(function(product) {

      const text =
        (
          product.code +
          " " +
          product.name +
          " " +
          product.colour +
          " " +
          product.category
        ).toLowerCase();

      const searchMatch =
        !search ||
        text.includes(search);

      const sizeMatch =
        !selectedSize ||
        product.sizes[selectedSize];

      return searchMatch && sizeMatch;

    });


  document.getElementById("count")
    .innerText =
      list.length +
      " design" +
      (list.length === 1 ? "" : "s");


  const container =
    document.getElementById("products");


  if (!list.length) {

    container.innerHTML =
      '<div class="empty">' +
      'No matching designs found.' +
      '</div>';

    return;

  }


  container.innerHTML =
    list.map(function(product) {

      return `

      <div class="product">

<img
  class="product-image"
  src="${product.image || ''}"
>

        <div class="product-info">

          <div class="code">
            ${product.code}
          </div>

          <div class="name">
            ${product.name}
          </div>

          <div class="colour">
            ${product.colour}
          </div>


<div class="sizes">

  ${SIZE_LIST.map(function(size) {

    return `
      <div
        class="size ${product.sizes[size] ? "available" : "sold"}"
        ${product.sizes[size] ? `onclick="selectSize(this, '${size}')"` : ""}
        data-size="${size}"
      >
        ${size}
        ${product.sizes[size] ? "✓" : "×"}
      </div>
    `;

  }).join("")}

</div>


<div class="size-warning" style="display:none;"></div>

<a
  class="whatsapp"
  href="#"
  onclick="return openWhatsApp(this);"
>
  WhatsApp
</a>

        </div>

      </div>

      `;

    }).join("");

}


document.getElementById("brandLogo").src =
  "https://drive.google.com/thumbnail?id=1Co-Uc_2qaDi2TMMFQ_kBdK3QfJrSYUbF&sz=w600";

loadProducts();


function selectSize(element, size) {

  const sizesBox = element.closest(".sizes");

  sizesBox.querySelectorAll(".size.available").forEach(function(item) {
    item.classList.remove("selected");
  });

  element.classList.add("selected");

  const productCard = element.closest(".product");
  const warning = productCard.querySelector(".size-warning");

  if (warning) {
    warning.style.display = "none";
    warning.textContent = "";
  }
}


function openWhatsApp(button) {

  const productCard = button.closest(".product");

  const selectedSize =
    productCard.querySelector(".size.selected");

  if (!selectedSize) {

    const warning =
      productCard.querySelector(".size-warning");

    if (warning) {
      warning.textContent =
        "⚠️ Please select your size first, then click WhatsApp below.";

      warning.style.display = "block";
    }

    return false;
  }

  const size = selectedSize.dataset.size;

  const code =
    productCard.querySelector(".code")?.innerText.trim() || "";

  const name =
    productCard.querySelector(".name")?.innerText.trim() || "";

  const colour =
    productCard.querySelector(".colour")?.innerText.trim() || "";

  const message =
    "Hi Ma'am, I'm interested in this product.\n\n" +
    "📦 Product Code: " + code + "\n" +
    "👗 Product: " + name + "\n" +
    "🎨 Colour: " + colour + "\n" +
    "📏 Size: " + size;

  const whatsappURL =
    "https://wa.me/918105836335?text=" +
    encodeURIComponent(message);

  button.href = whatsappURL;

  return true;
}

</script>

</body>
</html>
